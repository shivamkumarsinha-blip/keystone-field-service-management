spring:
  application:
    name: keystone
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${SPRING_DATASOURCE_USERNAME:keystone}
    password: ${SPRING_DATASOURCE_PASSWORD:keystone}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

keystone:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-at-least-256-bits-long}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  sla:
    low-hours: ${SLA_LOW_HOURS:72}
    medium-hours: ${SLA_MEDIUM_HOURS:48}
    high-hours: ${SLA_HIGH_HOURS:24}
    urgent-hours: ${SLA_URGENT_HOURS:4}
    at-risk-threshold-percent: ${SLA_AT_RISK_PERCENT:80}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
