services:
  postgres:
    image: postgres:16-alpine
    container_name: keystone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keystone}
      POSTGRES_USER: ${POSTGRES_USER:-keystone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keystone}
    ports:
      - "5432:5432"
    volumes:
      - keystone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keystone}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: keystone-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-keystone}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-keystone}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-keystone}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SLA_LOW_HOURS: ${SLA_LOW_HOURS:-72}
      SLA_MEDIUM_HOURS: ${SLA_MEDIUM_HOURS:-48}
      SLA_HIGH_HOURS: ${SLA_HIGH_HOURS:-24}
      SLA_URGENT_HOURS: ${SLA_URGENT_HOURS:-4}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    container_name: keystone-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  keystone_postgres_data:
